name: Qannas CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Kotlin Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Core Tests
        run: ./gradlew :core:test

  database-tests:
    name: PostgreSQL License Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: 
          POSTGRES_PASSWORD: postgres
        ports: 
          - 5432:5432
        options: >-
          --health-cmd pg_isready 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run Bootstrap
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Run Migrations
        run: |
          for f in supabase/migrations/*.sql; do 
            echo "Running $f..."
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run License Tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/license_test.sql

  build-release:
    name: Build Release APK & AAB
    needs: [unit-tests, database-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Decode Keystore from Secrets
        env:
          KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}"
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          else
            echo "Warning: KEYSTORE_BASE64 secret is not set. Build will fail if release is requested."
          fi

      - name: Create local.properties from Secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "QANNAS_KEYSTORE=$RUNNER_TEMP/upload.jks" >> local.properties
          echo "QANNAS_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "QANNAS_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "QANNAS_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Build with Gradle
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qannas-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qannas-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
