name: Sabbaq CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# لا يحتاج أي عمل إلى صلاحيات كتابة أو إلى GITHUB_TOKEN ذي صلاحيات افتراضية واسعة.
permissions:
  contents: read

concurrency:
  group: sabbaq-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    # للمستودعات الخاصة: فعّل هذا المتغير فقط عند توفر GitHub Code Security.
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: [self-hosted, linux, x64, sabbaq-sandbox]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review introduced dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  # Every check runs once per exact source tree. A merge to main whose tree was already
  # verified by its pull request reuses that verification instead of repeating 30 minutes
  # of tests; anything untested (a direct push, a moved base) is tested in full.
  tested-tree:
    name: Reuse pull request verification
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: [self-hosted, linux, x64, sabbaq-sandbox]
    timeout-minutes: 5
    # This is only a cache/skip optimization. If its runner or lookup fails, an empty
    # `verified` output makes downstream jobs run the complete required validation.
    # Never let this optional shortcut fail the product checks or release gate.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      verified: ${{ steps.tree.outputs.verified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Look for a verification of this exact tree
        id: tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
          WORKFLOW_PATH: .github/workflows/build-apk.yml
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          verified=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # A marker is only a pointer to a run; the run itself must prove the tree passed:
            # this repository (never a fork), this workflow file, a pull_request run, finished
            # successfully. Its workflow definition is part of this same tree, so it is exactly
            # the definition now merged into main (a run cannot vouch with a different one).
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=sabbaq-verified-${tree}&per_page=20" \
              --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == ${REPO_ID}) | .workflow_run.id] | unique | .[]")"
            for run in ${runs}; do
              ok="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" \
                --jq "(.path == \"${WORKFLOW_PATH}\") and (.event == \"pull_request\") and (.status == \"completed\") and (.conclusion == \"success\") and (.head_repository.id == ${REPO_ID})")"
              if [[ "${ok}" == "true" ]]; then verified=true; echo "Verified by run ${run}"; break; fi
            done
          fi
          echo "verified=${verified}" >> "$GITHUB_OUTPUT"
          echo "Tree ${tree}: already verified = ${verified}"

  verify:
    name: Android unit tests and lint
    needs: tested-tree
    if: always() && needs.tested-tree.outputs.verified != 'true'
    runs-on: [self-hosted, linux, x64, sabbaq-sandbox]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run deterministic Android checks
        run: ./gradlew --no-daemon :core:test :app:testDirectDebugUnitTest :app:testPlayDebugUnitTest :app:lintDirectDebug :app:lintPlayDebug :app:assembleDirectDebug :app:assemblePlayDebug :app:assembleDirectDebugAndroidTest
      - name: Run admin regression tests
        run: node --test admin/tests/admin-static.test.mjs
      - name: Upload debug APK and validation reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sabbaq-validation-${{ github.sha }}
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/androidTest/direct/debug/*.apk
            app/build/reports/lint-results-*.txt
            app/build/reports/tests/*/index.html
            core/build/reports/tests/*/index.html
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  ui-smoke:
    name: Native Android screens (${{ matrix.suite }})
    needs: [tested-tree, verify]
    if: >-
      always() && needs.tested-tree.outputs.verified != 'true' &&
      needs.verify.result == 'success'
    runs-on: [self-hosted, linux, x64, sabbaq-sandbox]
    timeout-minutes: 60
    strategy:
      # Each suite has its own emulator, in parallel; one flaky suite can be re-run alone.
      fail-fast: false
      matrix:
        include:
          - suite: direct-screens
            command: python3 scripts/android_ui_smoke.py --apk ci-input/app/build/outputs/apk/direct/debug/app-direct-debug.apk --package app.sabbaq.driver.debug --distribution direct --out ui-screenshots/direct
          - suite: direct-flows
            command: python3 scripts/android_flow_tests.py --apk ci-input/app/build/outputs/apk/direct/debug/app-direct-debug.apk --test-apk ci-input/app/build/outputs/apk/androidTest/direct/debug/app-direct-debug-androidTest.apk --out ui-screenshots/flow-tests
          - suite: play-screens
            command: python3 scripts/android_ui_smoke.py --apk ci-input/app/build/outputs/apk/play/debug/app-play-debug.apk --package app.sabbaq.driver.debug --distribution play --out ui-screenshots/play
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download verified debug APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sabbaq-validation-${{ github.sha }}
          path: ci-input
      - name: Configure emulator acceleration when KVM is available
        run: |
          if [[ -e /dev/kvm ]]; then
            if sudo -n true 2>/dev/null; then
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
            fi
          else
            echo "::warning::KVM unavailable; running emulator with software acceleration."
          fi
      # A booted emulator snapshot is cached, so each run resumes it instead of cold-booting.
      # Tests never save back into it (-no-snapshot-save): every run starts from the same clean state.
      - name: Restore emulator snapshot
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-google_apis-x86_64-pixel_6-2048M-v1
      - name: Create emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d0 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-boot-timeout: ${{ runner.environment == 'self-hosted' && 1200 || 360 }}
          force-avd-creation: false
          disable-animations: false
          emulator-options: ${{ runner.environment == 'self-hosted' && '-accel off ' || '' }}-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: echo "Emulator snapshot created for caching."
      - name: Open native screens without account credentials or service activation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-boot-timeout: ${{ runner.environment == 'self-hosted' && 1200 || 360 }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: ${{ runner.environment == 'self-hosted' && '-accel off ' || '' }}-no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ${{ matrix.command }}
      - name: Preserve native screenshots and launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sabbaq-native-ui-${{ github.sha }}-${{ matrix.suite }}
          path: ui-screenshots/
          if-no-files-found: warn
          retention-days: 14

  # Records that this exact tree passed every check, so the merge to main can reuse it.
  verified-marker:
    name: Record verified tree
    needs: [tested-tree, verify, ui-smoke, database-tests]
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.tested-tree.outputs.verified != 'true' &&
      needs.verify.result == 'success' && needs.ui-smoke.result == 'success' &&
      needs.database-tests.result == 'success'
    runs-on: [self-hosted, linux, x64, sabbaq-sandbox]
    timeout-minutes: 5
    # This artifact only avoids re-running checks after merge; it is not a product check.
    # Runner or artifact-service outages must not turn passing app/database/UI checks red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Write marker
        id: marker
        shell: bash
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          printf '%s\n' "$tree" > verified-tree.txt
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sabbaq-verified-${{ steps.marker.outputs.tree }}
          path: verified-tree.txt
          retention-days: 30

  database-tests:
    name: PostgreSQL license tests
    runs-on: [self-hosted, linux, x64, sabbaq-sandbox]
    timeout-minutes: 10
    env:
      PGDATABASE: postgres
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: 54321
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Start isolated PostgreSQL 16 cluster
        shell: bash
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/16/bin
          if [[ ! -x "$pg_bin/initdb" ]]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-16
          fi
          pg_data="$RUNNER_TEMP/sabbaq-postgres"
          if [[ -e "$pg_data" ]]; then rm -rf -- "$pg_data"; fi
          echo "PGDATA=${pg_data}" >> "$GITHUB_ENV"
          "$pg_bin/initdb" -D "$pg_data" --username=postgres --auth=trust --no-locale --encoding=UTF8
          "$pg_bin/pg_ctl" -D "$pg_data" -l "$RUNNER_TEMP/sabbaq-postgres.log" -o "-h 127.0.0.1 -p ${PGPORT} -k ${RUNNER_TEMP}" start
          for _ in $(seq 1 30); do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/sabbaq-postgres.log"
          exit 1
      - name: Run bootstrap
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Run migrations
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          ((${#migrations[@]} > 0)) || { echo "No database migrations found" >&2; exit 1; }
          for migration in "${migrations[@]}"; do
            echo "Running ${migration}..."
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Run license tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/license_test.sql
      - name: Run registration and admin contract tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/registration_admin_test.sql
      - name: Run Saudi commercial policy tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/saudi_commercial_trial_test.sql
      - name: Run account deletion tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_test.sql
      - name: Run administration WhatsApp tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/admin_whatsapp_test.sql
      - name: Run device transfer tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/device_transfer_test.sql
      - name: Stop isolated PostgreSQL 16 cluster
        if: always()
        shell: bash
        run: |
          if [[ -n "${PGDATA:-}" && -s "${PGDATA}/postmaster.pid" ]]; then
            /usr/lib/postgresql/16/bin/pg_ctl -D "$PGDATA" stop -m fast || true
          fi
          if [[ "${PGDATA:-}" == "$RUNNER_TEMP/sabbaq-postgres" ]]; then
            rm -rf -- "$PGDATA"
          fi

  build-release:
    name: Build signed release APK and AAB
    needs: [tested-tree, verify, database-tests, ui-smoke]
    # لا تُتاح الأسرار في PR؛ كما يلزم أن يكون المصدر فرعاً مسمّى صراحةً.
    # Builds only when this exact tree passed every check: here, or in its pull request.
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.tested-tree.result == 'success' &&
      needs.database-tests.result == 'success' &&
        (needs.tested-tree.outputs.verified == 'true' ||
        (needs.verify.result == 'success' && needs.ui-smoke.result == 'success'))
    environment: production
    runs-on: [self-hosted, linux, x64, sabbaq-sandbox]
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || '1020844982029-08j86skm4iroolntbu3guhda1m9km4lt.apps.googleusercontent.com' }}
      SABBAQ_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SABBAQ_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SABBAQ_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Validate and stage signing material
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_WEB_CLIENT_ID:-}" ]]; then
            GOOGLE_WEB_CLIENT_ID="1020844982029-08j86skm4iroolntbu3guhda1m9km4lt.apps.googleusercontent.com"
          fi
          for required in KEYSTORE_BASE64 SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_WEB_CLIENT_ID SABBAQ_KEYSTORE_PASSWORD SABBAQ_KEY_ALIAS SABBAQ_KEY_PASSWORD; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error title=Missing release configuration::${required} is required for a signed release."
              exit 1
            fi
          done
          umask 077
          keystore_path="${RUNNER_TEMP}/sabbaq-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          keytool -list -keystore "$keystore_path" -storepass "$SABBAQ_KEYSTORE_PASSWORD" -alias "$SABBAQ_KEY_ALIAS" >/dev/null
          printf 'SABBAQ_KEYSTORE=%s\n' "$keystore_path" >> "$GITHUB_ENV"
      - name: Run release configuration preflight
        run: ./gradlew --no-daemon :app:verifyReleaseConfiguration
      - name: Build signed release artifacts
        run: ./gradlew --no-daemon :app:assembleDirectRelease :app:bundleDirectRelease :app:assemblePlayRelease :app:bundlePlayRelease
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sabbaq-release-apk-${{ github.sha }}
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sabbaq-release-aab-${{ github.sha }}
          path: app/build/outputs/bundle/*Release/*.aab
          if-no-files-found: error
          retention-days: 14
