name: Qannas CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# لا يحتاج أي عمل إلى صلاحيات كتابة أو إلى GITHUB_TOKEN ذي صلاحيات افتراضية واسعة.
permissions:
  contents: read

concurrency:
  group: qannas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    # للمستودعات الخاصة: فعّل هذا المتغير فقط عند توفر GitHub Code Security.
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review introduced dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  verify:
    name: Android unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run deterministic Android checks
        run: ./gradlew --no-daemon :core:test :app:testDirectDebugUnitTest :app:testPlayDebugUnitTest :app:lintDirectDebug :app:lintPlayDebug :app:assembleDirectDebug :app:assemblePlayDebug
      - name: Run admin regression tests
        run: node --test admin/tests/admin-static.test.mjs
      - name: Upload debug APK and validation reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qannas-validation-${{ github.sha }}
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/reports/
            core/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  ui-smoke:
    name: Native Android screens (direct and Play)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download verified debug APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qannas-validation-${{ github.sha }}
          path: ci-input
      - name: Enable hardware acceleration in the ephemeral test runner
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open native screens without account credentials or service activation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            python3 scripts/android_ui_smoke.py --apk ci-input/app/build/outputs/apk/direct/debug/app-direct-debug.apk --package app.qannas.driver.debug --distribution direct --out ui-screenshots/direct
            python3 scripts/android_ui_smoke.py --apk ci-input/app/build/outputs/apk/play/debug/app-play-debug.apk --package app.qannas.driver.debug --distribution play --out ui-screenshots/play
      - name: Preserve native screenshots and launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qannas-native-ui-${{ github.sha }}
          path: ui-screenshots/
          if-no-files-found: warn
          retention-days: 14

  database-tests:
    name: PostgreSQL license tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGDATABASE: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run bootstrap
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Run migrations
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          ((${#migrations[@]} > 0)) || { echo "No database migrations found" >&2; exit 1; }
          for migration in "${migrations[@]}"; do
            echo "Running ${migration}..."
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Run license tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/license_test.sql
      - name: Run registration and admin contract tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/registration_admin_test.sql
      - name: Run Saudi commercial policy tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/saudi_commercial_trial_test.sql
      - name: Run account deletion tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_test.sql

  build-release:
    name: Build signed release APK and AAB
    needs: [verify, database-tests, ui-smoke]
    # لا تُتاح الأسرار في PR؛ كما يلزم أن يكون المصدر فرعاً مسمّى صراحةً.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || '1020844982029-08j86skm4iroolntbu3guhda1m9km4lt.apps.googleusercontent.com' }}
      QANNAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      QANNAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      QANNAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Validate and stage signing material
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_WEB_CLIENT_ID:-}" ]]; then
            GOOGLE_WEB_CLIENT_ID="1020844982029-08j86skm4iroolntbu3guhda1m9km4lt.apps.googleusercontent.com"
          fi
          for required in KEYSTORE_BASE64 SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_WEB_CLIENT_ID QANNAS_KEYSTORE_PASSWORD QANNAS_KEY_ALIAS QANNAS_KEY_PASSWORD; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error title=Missing release configuration::${required} is required for a signed release."
              exit 1
            fi
          done
          umask 077
          keystore_path="${RUNNER_TEMP}/qannas-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          keytool -list -keystore "$keystore_path" -storepass "$QANNAS_KEYSTORE_PASSWORD" -alias "$QANNAS_KEY_ALIAS" >/dev/null
          printf 'QANNAS_KEYSTORE=%s\n' "$keystore_path" >> "$GITHUB_ENV"
      - name: Run release configuration preflight
        run: ./gradlew --no-daemon :app:verifyReleaseConfiguration
      - name: Build signed release artifacts
        run: ./gradlew --no-daemon :app:assembleDirectRelease :app:bundleDirectRelease :app:assemblePlayRelease :app:bundlePlayRelease
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qannas-release-apk-${{ github.sha }}
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qannas-release-aab-${{ github.sha }}
          path: app/build/outputs/bundle/*Release/*.aab
          if-no-files-found: error
          retention-days: 14
