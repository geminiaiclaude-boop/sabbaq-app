<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://*.supabase.co; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests">
    <title>لوحة إدارة قناص</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous" defer></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container" aria-labelledby="page-title">
        <h1 id="page-title">لوحة إدارة قناص</h1>
        <noscript><p class="notice notice--error">تتطلب لوحة الإدارة تفعيل JavaScript.</p></noscript>
        <p id="app-status" class="notice" role="status" aria-live="polite" aria-atomic="true" hidden></p>

        <section id="login-section" aria-labelledby="login-title">
            <h2 id="login-title">دخول المشرف</h2>
            <form id="login-form" novalidate>
                <div class="field">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" autocomplete="username" inputmode="email" maxlength="254" required>
                </div>
                <div class="field">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button id="login-button" type="submit">تسجيل الدخول</button>
            </form>
        </section>

        <section id="dashboard-section" aria-label="لوحة الإدارة" hidden>
            <div class="dashboard-header">
                <h2>إدارة الحسابات والأكواد</h2>
                <button id="logout-button" class="btn-secondary" type="button">تسجيل الخروج</button>
            </div>
            <div class="tabs" role="tablist" aria-label="أقسام لوحة الإدارة">
                <button id="drivers-tab" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="tab-drivers">السائقون</button>
                <button id="codes-tab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="tab-codes">أكواد التفعيل</button>
            </div>

            <section id="tab-drivers" class="tab-content" role="tabpanel" aria-labelledby="drivers-tab">
                <div class="toolbar">
                    <button id="refresh-drivers" type="button">تحديث بيانات السائقين</button>
                    <div class="pagination" aria-label="صفحات السائقين">
                        <button id="drivers-previous" class="btn-secondary" type="button" disabled>السابق</button>
                        <span id="drivers-page" aria-live="polite">الصفحة 1</span>
                        <button id="drivers-next" class="btn-secondary" type="button" disabled>التالي</button>
                    </div>
                </div>
                <div class="table-wrapper" tabindex="0">
                    <table>
                        <caption class="sr-only">قائمة السائقين</caption>
                        <thead><tr><th scope="col">الاسم</th><th scope="col">الهاتف</th><th scope="col">الحالة</th><th scope="col">نهاية الاشتراك</th><th scope="col">معرف الجهاز</th><th scope="col">إجراءات</th></tr></thead>
                        <tbody id="drivers-list"></tbody>
                    </table>
                </div>
            </section>

            <section id="tab-codes" class="tab-content" role="tabpanel" aria-labelledby="codes-tab" hidden>
                <div class="card">
                    <h3>توليد أكواد جديدة</h3>
                    <form id="code-generation-form" class="toolbar" novalidate>
                        <div class="field compact-field">
                            <label for="code-count">عدد الأكواد</label>
                            <input type="number" id="code-count" name="count" value="10" min="1" max="500" step="1" inputmode="numeric" required>
                        </div>
                        <div class="field compact-field">
                            <label for="code-days">مدة الاشتراك</label>
                            <select id="code-days" name="days">
                                <option value="7">7 أيام (أسبوع)</option>
                                <option value="30" selected>30 يومًا (شهر)</option>
                                <option value="90">90 يومًا (3 أشهر)</option>
                                <option value="365">365 يومًا (سنة)</option>
                            </select>
                        </div>
                        <div class="field batch-field">
                            <label for="code-batch">اسم الدفعة (اختياري)</label>
                            <input type="text" id="code-batch" name="batch" maxlength="80" autocomplete="off">
                        </div>
                        <button id="generate-codes" type="submit">توليد الأكواد</button>
                        <button id="export-codes" class="btn-secondary" type="button">تصدير الأكواد المتاحة CSV</button>
                    </form>
                </div>
                <div class="toolbar">
                    <button id="refresh-codes" type="button">تحديث الأكواد</button>
                    <div class="pagination" aria-label="صفحات الأكواد">
                        <button id="codes-previous" class="btn-secondary" type="button" disabled>السابق</button>
                        <span id="codes-page" aria-live="polite">الصفحة 1</span>
                        <button id="codes-next" class="btn-secondary" type="button" disabled>التالي</button>
                    </div>
                </div>
                <div class="table-wrapper" tabindex="0">
                    <table>
                        <caption class="sr-only">قائمة أكواد التفعيل</caption>
                        <thead><tr><th scope="col">الكود</th><th scope="col">المدة (أيام)</th><th scope="col">الدفعة</th><th scope="col">الحالة</th><th scope="col">تاريخ الإنشاء</th><th scope="col">المستخدم (ID)</th></tr></thead>
                        <tbody id="codes-list"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
